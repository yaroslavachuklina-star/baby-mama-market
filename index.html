<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Baby & Mama Market 🌸</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#f8eee9;
  --card:#fffaf7;
  --accent:#a75b73;
  --accent2:#7d3f57;
  --text:#3d2b32;
  --muted:#8d747d;
  --line:#ead8df;
  --danger:#c75a67;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:var(--bg);
  color:var(--text);
  padding-bottom:85px;
}
button,input,textarea,select{font:inherit}
button{border:0;cursor:pointer}
header{
  padding:22px 18px 14px;
  background:#fff;
  border-bottom:1px solid var(--line);
}
.logo{
  font-size:25px;
  font-weight:800;
}
.subtitle{
  color:var(--muted);
  font-size:14px;
  margin-top:4px;
}
.wrap{padding:14px 16px}
.search{
  width:100%;
  padding:14px 16px;
  border:1px solid var(--line);
  border-radius:16px;
  background:#fff;
  outline:none;
}
.sell{
  width:100%;
  padding:14px;
  margin:12px 0;
  border-radius:16px;
  background:var(--accent2);
  color:#fff;
  font-weight:700;
}
.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding-bottom:13px;
}
.categories button{
  white-space:nowrap;
  padding:9px 13px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
}
.categories button.active{
  background:var(--accent);
  color:#fff;
}
.grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  overflow:hidden;
}
.photo{
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#eee;
}
.card-body{padding:11px}
.card-title{
  font-weight:700;
  font-size:15px;
  min-height:38px;
}
.price{
  color:var(--accent2);
  font-size:18px;
  font-weight:800;
  margin-top:5px;
}
.meta{
  color:var(--muted);
  font-size:12px;
  margin-top:4px;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  height:75px;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  z-index:20;
}
.bottom button{
  background:transparent;
  color:var(--text);
  font-size:12px;
}
.bottom span{
  display:block;
  font-size:22px;
  margin-bottom:3px;
}
.modal{
  position:fixed;
  inset:0;
  background:rgba(35,20,25,.45);
  z-index:50;
  display:none;
  align-items:flex-end;
}
.modal.show{display:flex}
.sheet{
  width:100%;
  max-height:92vh;
  overflow:auto;
  background:#fffaf8;
  border-radius:24px 24px 0 0;
  padding:20px 18px 30px;
}
.close{
  float:right;
  width:38px;
  height:38px;
  border-radius:50%;
  background:#f0e2e5;
  font-size:22px;
}
.field{margin:13px 0}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:13px;
  border:1px solid var(--line);
  border-radius:13px;
  background:#fff;
}
.field textarea{
  min-height:90px;
  resize:vertical;
}
.preview{
  width:100%;
  max-height:250px;
  object-fit:cover;
  border-radius:15px;
  margin-top:10px;
  display:none;
}
.form-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.cancel,.submit,.danger,.secondary{
  flex:1;
  padding:13px;
  border-radius:14px;
  font-weight:700;
}
.cancel,.secondary{
  background:#eee2e5;
  color:var(--text);
}
.submit{
  background:var(--accent2);
  color:white;
}
.danger{
  background:var(--danger);
  color:#fff;
}
.detail-photo{
  width:100%;
  max-height:380px;
  object-fit:cover;
  border-radius:18px;
}
.profile-head{
  text-align:center;
  padding:10px;
}
.profile-avatar{
  width:90px;
  height:90px;
  border-radius:50%;
  object-fit:cover;
  background:#ead8df;
}
.stars{
  display:flex;
  justify-content:center;
  gap:7px;
  margin:12px 0;
}
.star{
  font-size:31px;
  background:none;
  color:#c9b8a5;
}
.star.selected{color:#e0aa35}
.notice{
  padding:12px;
  border-radius:13px;
  background:#f3e7ea;
  font-size:13px;
  margin:10px 0;
}
.empty,.loading{
  grid-column:1/-1;
  text-align:center;
  color:var(--muted);
  padding:45px 15px;
}
.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:999px;
  background:#f0e2e5;
  font-size:12px;
  margin-top:8px;
}
</style>
</head>

<body>

<header>
  <div class="logo">🌸 Baby & Mama Market</div>
  <div class="subtitle">Речі для малюків від мам 💕</div>
</header>

<div class="wrap">

  <input
    id="search"
    class="search"
    placeholder="🔎 Пошук речей..."
  >

  <button class="sell" onclick="openSell()">
    ➕ Додати оголошення
  </button>

  <div class="categories">
    <button class="active" onclick="filterCategory('Усі',this)">Усі</button>
    <button onclick="filterCategory('Одяг',this)">Одяг</button>
    <button onclick="filterCategory('Взуття',this)">Взуття</button>
    <button onclick="filterCategory('Іграшки',this)">Іграшки</button>
    <button onclick="filterCategory('Аксесуари',this)">Аксесуари</button>
    <button onclick="filterCategory('Інше',this)">Інше</button>
  </div>

  <div id="products" class="grid">
    <div class="loading">Завантаження 🌸</div>
  </div>

</div>

<div class="bottom">
  <button onclick="showHome()">
    <span>🏠</span>
    Головна
  </button>

  <button onclick="openSell()">
    <span>➕</span>
    Продати
  </button>

  <button onclick="showMyListings()">
    <span>👤</span>
    Мої оголошення
  </button>
</div>


<!-- ДОДАТИ ОГОЛОШЕННЯ -->

<div id="sellModal" class="modal">
  <div class="sheet">

    <button class="close" onclick="closeSell()">×</button>

    <h2>Додати оголошення 🌸</h2>

    <div class="field">
      <label>Назва</label>
      <input id="title" placeholder="Наприклад: Боді для дівчинки">
    </div>

    <div class="field">
      <label>Категорія</label>
      <select id="category">
        <option>Одяг</option>
        <option>Взуття</option>
        <option>Іграшки</option>
        <option>Аксесуари</option>
        <option>Інше</option>
      </select>
    </div>

    <div class="field">
      <label>Розмір</label>
      <input id="size" placeholder="Наприклад: 74">
    </div>

    <div class="field">
      <label>Стан</label>
      <select id="condition">
        <option>Нове</option>
        <option>Як нове</option>
        <option>Дуже хороший стан</option>
        <option>Є нюанси</option>
      </select>
    </div>

    <div class="field">
      <label>Ціна, грн</label>
      <input id="price" type="number" placeholder="300">
    </div>

    <div class="field">
      <label>Місто</label>
      <input id="city" placeholder="Київ">
    </div>

    <div class="field">
      <label>Telegram продавця</label>
      <input id="telegram" placeholder="@username">
    </div>

    <div class="field">
      <label>📸 Фото з галереї</label>
      <input
        id="photo"
        type="file"
        accept="image/*"
        onchange="previewPhoto(event)"
      >
      <img id="photoPreview" class="preview">
    </div>

    <div class="field">
      <label>Опис</label>
      <textarea
        id="description"
        placeholder="Опиши річ..."
      ></textarea>
    </div>

    <div class="form-buttons">
      <button class="cancel" onclick="closeSell()">
        Скасувати
      </button>

      <button id="publishButton" class="submit" onclick="addListing()">
        Опублікувати
      </button>
    </div>

  </div>
</div>


<!-- ДЕТАЛІ -->

<div id="detailModal" class="modal">
  <div class="sheet">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detail"></div>
  </div>
</div>


<!-- ПРОФІЛЬ -->

<div id="profileModal" class="modal">
  <div class="sheet">
    <button class="close" onclick="closeProfile()">×</button>
    <div id="profileContent"></div>
  </div>
</div>


<script>

/* ==========================================
   SUPABASE
   ЦІ ДВА РЯДКИ ЗАПОВНИМО НАСТУПНИМ КРОКОМ
========================================== */

const SUPABASE_URL = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvdGpxbG9pY3RtemhxY3Jlc2FxIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5OTY3NTYsImV4cCI6MjEwNTU3Mjc1Nn0.EBHCCl9S3Q4HmCL5VkxV9aRscS0FI2wodDjCPeXskeI";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtvdGpxbG9pY3RtemhxY3Jlc2FxIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImlhdCI6MTc4OTk5Njc1NiwiZXhwIjoyMTA1NTcyNzU2fQ.Fb0wh4JKthprSK29t-No9NVfWwtGV5h_3TYRSz4-w4w";

const db = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);


/* TELEGRAM */

const tg = window.Telegram?.WebApp;

if(tg){
  tg.ready();
  tg.expand();
}


/* STATE */

let currentUser = null;
let listings = [];
let categoryFilter = "Усі";


/* HELPERS */

function escapeHTML(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function placeholder(){
  return "https://placehold.co/700x700/f3e4df/713b4b?text=Baby+%26+Mama";
}

function telegramName(){
  const user = tg?.initDataUnsafe?.user;

  if(!user) return "";

  return user.username
    ? "@" + user.username
    : "";
}

function telegramDisplayName(){
  const user = tg?.initDataUnsafe?.user;

  if(!user) return "Мама";

  return [
    user.first_name,
    user.last_name
  ].filter(Boolean).join(" ") || "Мама";
}


/* AUTH */

async function initAuth(){

  const {
    data:{session}
  } = await db.auth.getSession();

  if(session){
    currentUser = session.user;
  }else{

    const {
      data,
      error
    } = await db.auth.signInAnonymously();

    if(error){
      console.error(error);
      document.getElementById("products").innerHTML =
        `<div class="empty">
          Не вдалося підключитися до маркету 😔
        </div>`;
      return;
    }

    currentUser = data.user;
  }

  await ensureProfile();
  await loadListings();
}


/* PROFILE */

async function ensureProfile(){

  if(!currentUser) return;

  const username = telegramName();
  const displayName = telegramDisplayName();

  const {
    data:existing
  } = await db
    .from("profiles")
    .select("id")
    .eq("id",currentUser.id)
    .maybeSingle();

  if(existing){
    await db
      .from("profiles")
      .update({
        username,
        display_name:displayName
      })
      .eq("id",currentUser.id);

    return;
  }

  const {error} = await db
    .from("profiles")
    .insert({
      id:currentUser.id,
      username,
      display_name:displayName
    });

  if(error){
    console.error("Profile error",error);
  }
}


/* LOAD LISTINGS */

async function loadListings(){

  document.getElementById("products").innerHTML =
    `<div class="loading">Завантаження 🌸</div>`;

  const {
    data,
    error
  } = await db
    .from("listings")
    .select(`
      *,
      profiles (
        username,
        display_name,
        avatar_url
      )
    `)
    .eq("status","active")
    .order("created_at",{ascending:false});

  if(error){
    console.error(error);

    document.getElementById("products").innerHTML =
      `<div class="empty">
        Не вдалося завантажити оголошення 😔
      </div>`;

    return;
  }

  listings = data || [];
  render();
}


/* RENDER */

function render(){

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase()
      .trim();

  const filtered = listings.filter(p=>{

    const categoryOK =
      categoryFilter === "Усі" ||
      p.category === categoryFilter;

    const text =
      `${p.title} ${p.category} ${p.size} ${p.city}`
        .toLowerCase();

    return categoryOK && text.includes(search);
  });

  const box = document.getElementById("products");

  if(!filtered.length){
    box.innerHTML =
      `<div class="empty">
        🌸<br><br>
        Тут поки немає оголошень
      </div>`;
    return;
  }

  box.innerHTML = filtered.map(p=>`

    <div class="card" onclick="openDetail(${p.id})">

      <img
        class="photo"
        src="${escapeHTML(p.photo_url || placeholder())}"
        onerror="this.src='${placeholder()}'"
      >

      <div class="card-body">

        <div class="card-title">
          ${escapeHTML(p.title)}
        </div>

        <div class="price">
          ${Number(p.price).toLocaleString("uk-UA")} грн
        </div>

        <div class="meta">
          📏 ${escapeHTML(p.size || "Не вказано")}
        </div>

        <div class="meta">
          📍 ${escapeHTML(p.city || "Не вказано")}
        </div>

        <div class="meta">
          ✨ ${escapeHTML(p.condition || "")}
        </div>

      </div>
    </div>

  `).join("");
}


/* SEARCH */

document
  .getElementById("search")
  .addEventListener("input",render);


/* CATEGORY */

function filterCategory(category,button){

  categoryFilter = category;

  document
    .querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));

  button.classList.add("active");

  render();
}


/* SELL MODAL */

function openSell(){

  if(!currentUser){
    alert("Зачекай кілька секунд 🌸");
    return;
  }

  const username = telegramName();

  if(username){
    document.getElementById("telegram").value = username;
  }

  document
    .getElementById("sellModal")
    .classList.add("show");
}

function closeSell(){
  document
    .getElementById("sellModal")
    .classList.remove("show");
}


/* PHOTO PREVIEW */

function previewPhoto(event){

  const file = event.target.files?.[0];
  const preview = document.getElementById("photoPreview");

  if(!file){
    preview.style.display = "none";
    preview.src = "";
    return;
  }

  preview.src = URL.createObjectURL(file);
  preview.style.display = "block";
}


/* PHOTO UPLOAD */

async function uploadPhoto(file){

  if(!file) return null;

  const extension =
    file.name.split(".").pop()?.toLowerCase() || "jpg";

  const fileName =
    `${currentUser.id}/${Date.now()}.${extension}`;

  const {
    error
  } = await db.storage
    .from("listing-photos")
    .upload(
      fileName,
      file,
      {
        cacheControl:"3600",
        upsert:false
      }
    );

  if(error){
    throw error;
  }

  const {
    data
  } = db.storage
    .from("listing-photos")
    .getPublicUrl(fileName);

  return data.publicUrl;
}


/* ADD LISTING */

async function addListing(){

  const title =
    document.getElementById("title").value.trim();

  const price =
    document.getElementById("price").value.trim();

  if(!title || !price){
    alert("Заповни назву та ціну ❤️");
    return;
  }

  const button =
    document.getElementById("publishButton");

  button.disabled = true;
  button.textContent = "Публікуємо... 🌸";

  try{

    const file =
      document.getElementById("photo").files?.[0];

    let photoURL = null;

    if(file){
      photoURL = await uploadPhoto(file);
    }

    const listing = {

      seller_id:currentUser.id,

      title,

      category:
        document.getElementById("category").value,

      size:
        document.getElementById("size").value.trim()
        || "Не вказано",

      condition:
        document.getElementById("condition").value,

      price:Number(price),

      city:
        document.getElementById("city").value.trim()
        || "Не вказано",

      photo_url:photoURL,

      description:
        document.getElementById("description").value.trim(),

      status:"active"
    };

    const {
      error
    } = await db
      .from("listings")
      .insert(listing);

    if(error){
      throw error;
    }

    closeSell();
    clearForm();

    await loadListings();

    alert("Оголошення опубліковано 🌸");

  }catch(error){

    console.error(error);

    alert(
      "Не вдалося опублікувати 😔\n" +
      (error.message || "")
    );

  }finally{

    button.disabled = false;
    button.textContent = "Опублікувати";
  }
}


/* CLEAR FORM */

function clearForm(){

  document.getElementById("title").value = "";
  document.getElementById("size").value = "";
  document.getElementById("price").value = "";
  document.getElementById("city").value = "";
  document.getElementById("description").value = "";
  document.getElementById("photo").value = "";

  const preview =
    document.getElementById("photoPreview");

  preview.src = "";
  preview.style.display = "none";
}


/* DETAILS */

async function openDetail(id){

  const p = listings.find(x=>Number(x.id) === Number(id));

  if(!p) return;

  const own =
    currentUser &&
    p.seller_id === currentUser.id;

  let telegram =
    p.profiles?.username || "";

  telegram =
    telegram.replace("@","").trim();

  document.getElementById("detail").innerHTML = `

    <img
      class="detail-photo"
      src="${escapeHTML(p.photo_url || placeholder())}"
      onerror="this.src='${placeholder()}'"
    >

    <h2>${escapeHTML(p.title)}</h2>

    <div class="price">
      ${Number(p.price).toLocaleString("uk-UA")} грн
    </div>

    <p>
      📏 <b>Розмір:</b>
      ${escapeHTML(p.size || "Не вказано")}
    </p>

    <p>
      ✨ <b>Стан:</b>
      ${escapeHTML(p.condition || "")}
    </p>

    <p>
      📍 <b>Місто:</b>
      ${escapeHTML(p.city || "Не вказано")}
    </p>

    <p>
      ${escapeHTML(p.description || "Опис не додано.")}
    </p>

    <button
      class="secondary"
      style="width:100%;margin-top:8px"
      onclick="openSellerProfile('${p.seller_id}')"
    >
      👩 Профіль продавця
    </button>

    ${
      telegram && !own
      ? `
        <button
          class="sell"
          onclick="openTelegram('${escapeHTML(telegram)}')"
        >
          💬 Написати продавцю
        </button>
      `
      : ""
    }

    ${
      own
      ? `
        <div class="form-buttons">

          <button
            class="secondary"
            onclick="markSold(${p.id})"
          >
            ✅ Продано
          </button>

          <button
            class="danger"
            onclick="deleteListing(${p.id})"
          >
            🗑 Видалити
          </button>

        </div>
      `
      : ""
    }

  `;

  document
    .getElementById("detailModal")
    .classList.add("show");
}

function closeDetail(){
  document
    .getElementById("detailModal")
    .classList.remove("show");
}


/* TELEGRAM */

function openTelegram(username){

  const url =
    "https://t.me/" + username;

  if(tg){
    tg.openTelegramLink(url);
  }else{
    window.open(url,"_blank");
  }
}


/* DELETE */

async function deleteListing(id){

  if(!confirm("Видалити оголошення?")){
    return;
  }

  const {
    error
  } = await db
    .from("listings")
    .delete()
    .eq("id",id)
    .eq("seller_id",currentUser.id);

  if(error){
    alert("Не вдалося видалити 😔");
    return;
  }

  closeDetail();
  await loadListings();
}


/* SOLD */

async function markSold(id){

  const {
    error
  } = await db
    .from("listings")
    .update({
      status:"sold"
    })
    .eq("id",id)
    .eq("seller_id",currentUser.id);

  if(error){
    alert("Не вдалося змінити статус 😔");
    return;
  }

  closeDetail();
  await loadListings();

  alert("Позначено як продано 🌸");
}


/* HOME */

function showHome(){

  categoryFilter = "Усі";

  document.getElementById("search").value = "";

  document
    .querySelectorAll(".categories button")
    .forEach((b,i)=>{
      b.classList.toggle("active",i===0);
    });

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* MY LISTINGS */

async function showMyListings(){

  if(!currentUser) return;

  const {
    data,
    error
  } = await db
    .from("listings")
    .select("*")
    .eq("seller_id",currentUser.id)
    .order("created_at",{ascending:false});

  if(error){
    alert("Не вдалося завантажити оголошення 😔");
    return;
  }

  const box =
    document.getElementById("products");

  if(!data?.length){

    box.innerHTML =
      `<div class="empty">
        🌸<br><br>
        У тебе ще немає оголошень
      </div>`;

    return;
  }

  box.innerHTML = data.map(p=>`

    <div
      class="card"
      onclick="openOwnDetail(${p.id})"
    >

      <img
        class="photo"
        src="${escapeHTML(p.photo_url || placeholder())}"
        onerror="this.src='${placeholder()}'"
      >

      <div class="card-body">

        <div class="card-title">
          ${escapeHTML(p.title)}
        </div>

        <div class="price">
          ${Number(p.price).toLocaleString("uk-UA")} грн
        </div>

        <div class="status">
          ${
            p.status === "sold"
              ? "Продано"
              : p.status === "reserved"
              ? "Заброньовано"
              : "Активне"
          }
        </div>

      </div>

    </div>

  `).join("");
}


async function openOwnDetail(id){

  const {
    data:p,
    error
  } = await db
    .from("listings")
    .select("*")
    .eq("id",id)
    .eq("seller_id",currentUser.id)
    .single();

  if(error || !p) return;

  document.getElementById("detail").innerHTML = `

    <img
      class="detail-photo"
      src="${escapeHTML(p.photo_url || placeholder())}"
      onerror="this.src='${placeholder()}'"
    >

    <h2>${escapeHTML(p.title)}</h2>

    <div class="price">
      ${Number(p.price).toLocaleString("uk-UA")} грн
    </div>

    <p>📏 ${escapeHTML(p.size || "")}</p>
    <p>✨ ${escapeHTML(p.condition || "")}</p>
    <p>📍 ${escapeHTML(p.city || "")}</p>

    <div class="status">
      ${
        p.status === "sold"
        ? "Продано"
        : p.status === "reserved"
        ? "Заброньовано"
        : "Активне"
      }
    </div>

    <div class="form-buttons">

      ${
        p.status !== "sold"
        ? `
          <button
            class="secondary"
            onclick="markSold(${p.id})"
          >
            ✅ Продано
          </button>
        `
        : ""
      }

      <button
        class="danger"
        onclick="deleteListing(${p.id})"
      >
        🗑 Видалити
      </button>

    </div>

  `;

  document
    .getElementById("detailModal")
    .classList.add("show");
}


/* SELLER PROFILE */

async function openSellerProfile(sellerID){

  const profileBox =
    document.getElementById("profileContent");

  profileBox.innerHTML =
    `<div class="loading">Завантаження 🌸</div>`;

  document
    .getElementById("profileModal")
    .classList.add("show");

  const [
    profileResult,
    listingsResult,
    ratingsResult
  ] = await Promise.all([

    db
      .from("profiles")
      .select("*")
      .eq("id",sellerID)
      .single(),

    db
      .from("listings")
      .select("*")
      .eq("seller_id",sellerID)
      .eq("status","active")
      .order("created_at",{ascending:false}),

    db
      .from("ratings")
      .select("rating")
      .eq("seller_id",sellerID)

  ]);

  const profile =
    profileResult.data;

  const sellerListings =
    listingsResult.data || [];

  const ratings =
    ratingsResult.data || [];

  const average =
    ratings.length
    ? (
        ratings.reduce(
          (sum,r)=>sum + Number(r.rating),
          0
        ) / ratings.length
      ).toFixed(1)
    : null;

  const username =
    profile?.username || "";

  profileBox.innerHTML = `

    <div class="profile-head">

      <div
        class="profile-avatar"
        style="
          margin:auto;
          display:grid;
          place-items:center;
          font-size:40px;
        "
      >
        👩
      </div>

      <h2>
        ${escapeHTML(profile?.display_name || "Мама")}
      </h2>

      ${
        username
        ? `<div class="meta">${escapeHTML(username)}</div>`
        : ""
      }

      <div style="margin-top:8px;font-size:18px">
        ⭐ ${average || "Ще немає оцінок"}
        ${
          average
          ? `<span class="meta">(${ratings.length})</span>`
          : ""
        }
      </div>

    </div>

    ${
      currentUser?.id !== sellerID
      ? `
        <div class="notice">
          Оціни продавця після спілкування або покупки 💕
        </div>

        <div class="stars">
          ${[1,2,3,4,5].map(n=>`
            <button
              class="star"
              onclick="rateSeller('${sellerID}',${n})"
            >
              ★
            </button>
          `).join("")}
        </div>
      `
      : ""
    }

    ${
      username && currentUser?.id !== sellerID
      ? `
        <button
          class="sell"
          onclick="openTelegram('${escapeHTML(username.replace("@",""))}')"
        >
          💬 Написати продавцю
        </button>
      `
      : ""
    }

    <h3>Оголошення продавця</h3>

    <div class="grid">

      ${
        sellerListings.length
        ? sellerListings.map(p=>`

          <div
            class="card"
            onclick="closeProfile();openDetail(${p.id})"
          >

            <img
              class="photo"
              src="${escapeHTML(p.photo_url || placeholder())}"
              onerror="this.src='${placeholder()}'"
            >

            <div class="card-body">

              <div class="card-title">
                ${escapeHTML(p.title)}
              </div>

              <div class="price">
                ${Number(p.price).toLocaleString("uk-UA")} грн
              </div>

            </div>

          </div>

        `).join("")
        : `
          <div class="empty">
            Немає активних оголошень
          </div>
        `
      }

    </div>

  `;
}

function closeProfile(){
  document
    .getElementById("profileModal")
    .classList.remove("show");
}


/* RATE SELLER */

async function rateSeller(sellerID,rating){

  if(!currentUser){
    return;
  }

  if(currentUser.id === sellerID){
    alert("Не можна оцінювати себе 🌸");
    return;
  }

  const {
    error
  } = await db
    .from("ratings")
    .upsert(
      {
        seller_id:sellerID,
        reviewer_id:currentUser.id,
        rating
      },
      {
        onConflict:"seller_id,reviewer_id"
      }
    );

  if(error){
    console.error(error);
    alert("Не вдалося зберегти оцінку 😔");
    return;
  }

  alert(`Дякуємо за оцінку ${rating} ⭐`);

  await openSellerProfile(sellerID);
}
