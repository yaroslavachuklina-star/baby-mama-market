<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#fff7f5">
<title>Baby & Mama Market 🌸</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#fff7f5;
  --card:#fff;
  --pink:#d87391;
  --pink-dark:#a94e6c;
  --pink-soft:#f9e5eb;
  --text:#3c2930;
  --muted:#927d84;
  --line:#eedde2;
  --red:#bc5362;
  --gold:#d09b37;
  --shadow:0 8px 25px rgba(87,47,61,.08);
}

*{box-sizing:border-box}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:100px;
}

button,input,select,textarea{font:inherit}
button{cursor:pointer;border:0}
button:disabled{opacity:.55;cursor:not-allowed}

header{
  position:sticky;
  top:0;
  z-index:20;
  background:rgba(255,247,245,.96);
  backdrop-filter:blur(16px);
  padding:calc(14px + env(safe-area-inset-top)) 16px 12px;
  border-bottom:1px solid var(--line);
}

.head{
  max-width:800px;
  margin:auto;
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.brand{
  display:flex;
  gap:10px;
  align-items:center;
  min-width:0;
}

.logo{
  width:46px;
  height:46px;
  min-width:46px;
  border-radius:15px;
  background:var(--pink-soft);
  display:grid;
  place-items:center;
  font-size:25px;
}

.brand-title{
  font-size:20px;
  font-weight:900;
}

.brand-sub{
  font-size:11px;
  color:var(--muted);
  margin-top:2px;
}

.avatar-top{
  width:42px;
  height:42px;
  min-width:42px;
  border-radius:50%;
  background:var(--pink-soft);
  display:grid;
  place-items:center;
  font-size:21px;
}

main{
  max-width:800px;
  margin:auto;
  padding:14px;
}

.hero{
  padding:19px;
  border-radius:24px;
  background:linear-gradient(135deg,#f8dfe7,#fff2e9);
  margin-bottom:13px;
}

.hero h1{
  margin:0;
  font-size:25px;
  line-height:1.1;
}

.hero p{
  margin:7px 0 0;
  color:#775c66;
  line-height:1.4;
}

.search-row{
  display:grid;
  grid-template-columns:minmax(0,1fr) 52px;
  gap:8px;
}

.search{
  width:100%;
  height:52px;
  padding:0 15px;
  border:1px solid var(--line);
  border-radius:17px;
  background:#fff;
  outline:none;
}

.filter-btn{
  width:52px;
  height:52px;
  border-radius:17px;
  background:#fff;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  font-size:20px;
}

.categories{
  display:flex;
  gap:8px;
  overflow:auto;
  padding:12px 0;
  scrollbar-width:none;
}

.categories::-webkit-scrollbar{display:none}

.chip{
  flex:0 0 auto;
  height:40px;
  padding:0 14px;
  border-radius:999px;
  background:#fff;
  color:var(--text);
  border:1px solid var(--line);
  font-weight:700;
  font-size:13px;
  display:flex;
  align-items:center;
  justify-content:center;
  white-space:nowrap;
}

.chip.active{
  background:var(--pink-dark);
  color:#fff;
  border-color:var(--pink-dark);
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:4px 2px 12px;
}

.section-head h2{
  margin:0;
  font-size:19px;
}

.count{
  color:var(--muted);
  font-size:13px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  position:relative;
  min-width:0;
  background:#fff;
  border:1px solid var(--line);
  border-radius:21px;
  overflow:hidden;
  box-shadow:var(--shadow);
}

.photo-box{
  position:relative;
  aspect-ratio:1/1;
  background:#f2e6e5;
}

.photo{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.favorite{
  position:absolute;
  right:8px;
  top:8px;
  width:38px;
  height:38px;
  padding:0;
  border-radius:50%;
  background:rgba(255,255,255,.92);
  font-size:19px;
  display:grid;
  place-items:center;
  z-index:3;
}

.badge{
  position:absolute;
  left:8px;
  top:8px;
  background:rgba(255,255,255,.94);
  padding:6px 9px;
  border-radius:999px;
  font-size:11px;
  font-weight:800;
}

.card-body{padding:11px}

.card-title{
  font-weight:900;
  font-size:14px;
  line-height:1.3;
  min-height:36px;
}

.price{
  font-size:19px;
  font-weight:900;
  color:var(--pink-dark);
  margin-top:5px;
}

.meta{
  font-size:11px;
  color:var(--muted);
  margin-top:5px;
  line-height:1.4;
}

.seller{
  margin-top:8px;
  padding-top:8px;
  border-top:1px solid var(--line);
  font-size:11px;
  font-weight:700;
}

.empty,.loading{
  grid-column:1/-1;
  text-align:center;
  padding:55px 20px;
  color:var(--muted);
  line-height:1.6;
}

.bottom{
  position:fixed;
  z-index:50;
  left:0;
  right:0;
  bottom:0;
  display:grid;
  grid-template-columns:repeat(4,minmax(0,1fr));
  background:rgba(255,255,255,.97);
  backdrop-filter:blur(15px);
  border-top:1px solid var(--line);
  padding:6px 4px calc(6px + env(safe-area-inset-bottom));
}

.nav{
  min-width:0;
  min-height:62px;
  background:none;
  color:var(--muted);
  font-size:10px;
  padding:4px 2px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:2px;
}

.nav span{
  height:27px;
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
}

.nav.active{color:var(--pink-dark)}

.sell-fab{
  width:48px;
  height:48px;
  border-radius:17px;
  background:var(--pink-dark);
  color:#fff;
  display:grid;
  place-items:center;
  margin:auto;
  font-size:26px;
  box-shadow:0 6px 16px rgba(169,78,108,.25);
}

.modal{
  display:none;
  position:fixed;
  inset:0;
  z-index:100;
  background:rgba(48,28,35,.5);
  align-items:flex-end;
}

.modal.show{display:flex}

.sheet{
  width:100%;
  max-width:720px;
  margin:auto;
  background:var(--bg);
  border-radius:28px 28px 0 0;
  max-height:94vh;
  overflow:auto;
  padding:19px 16px calc(28px + env(safe-area-inset-bottom));
  position:relative;
}

.close{
  position:absolute;
  right:13px;
  top:12px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f2e5e7;
  color:var(--text);
  font-size:23px;
  display:grid;
  place-items:center;
  z-index:5;
}

.sheet h2{
  margin:5px 50px 19px 0;
}

.field{margin:13px 0}

.field label{
  display:block;
  font-size:13px;
  font-weight:800;
  margin-bottom:7px;
}

.field > input,
.field > select,
.field > textarea{
  width:100%;
  border:1px solid var(--line);
  border-radius:15px;
  padding:14px;
  background:#fff;
  color:var(--text);
  outline:none;
}

.field > input,
.field > select{
  min-height:50px;
}

.field textarea{
  min-height:100px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  gap:9px;
}

.primary,.secondary,.danger{
  width:100%;
  min-height:50px;
  padding:0 14px;
  border-radius:15px;
  font-weight:900;
  margin-top:8px;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
}

.primary{
  background:var(--pink-dark);
  color:#fff;
}

.secondary{
  background:#f0e3e5;
  color:var(--text);
}

.danger{
  background:#fde4e8;
  color:var(--red);
}

.checks{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:8px;
}

.check{
  min-height:50px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:13px;
  padding:10px;
  font-size:12px;
  display:flex !important;
  align-items:center;
  margin:0 !important;
}

.check input{
  width:18px !important;
  height:18px;
  min-height:18px !important;
  margin:0 7px 0 0;
  padding:0;
  flex:0 0 auto;
}

.photo-preview{
  display:grid;
  grid-template-columns:repeat(3,minmax(0,1fr));
  gap:8px;
  margin-top:10px;
}

.preview-item{
  position:relative;
  aspect-ratio:1/1;
  border-radius:14px;
  overflow:hidden;
  background:#f2e6e5;
}

.preview-item img{
  width:100%;
  height:100%;
  object-fit:cover;
  display:block;
}

.remove-photo{
  position:absolute;
  top:6px;
  right:6px;
  width:31px;
  height:31px;
  padding:0;
  border-radius:50%;
  background:rgba(55,35,42,.9);
  color:#fff;
  font-size:20px;
  font-weight:900;
  display:grid;
  place-items:center;
  z-index:4;
}

.detail-img{
  width:100%;
  max-height:480px;
  object-fit:cover;
  border-radius:20px;
}

.gallery{
  display:flex;
  overflow:auto;
  gap:7px;
  margin-top:8px;
}

.gallery img{
  width:68px;
  height:68px;
  min-width:68px;
  object-fit:cover;
  border-radius:11px;
}

.detail-title{
  font-size:24px;
  font-weight:900;
  margin-top:14px;
}

.detail-price{
  font-size:25px;
  font-weight:900;
  color:var(--pink-dark);
  margin-top:5px;
}

.detail-row{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  line-height:1.45;
  font-size:14px;
}

.seller-box{
  margin-top:14px;
  padding:14px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
}

.admin-box{
  margin-top:12px;
  padding:10px 12px;
  background:#fff3d7;
  border:1px solid #edd29a;
  border-radius:14px;
  color:#75541c;
  font-size:12px;
  font-weight:800;
}

.profile-head{
  display:flex;
  align-items:center;
  gap:12px;
  margin-bottom:15px;
}

.profile-avatar{
  width:68px;
  height:68px;
  min-width:68px;
  border-radius:50%;
  object-fit:cover;
  background:var(--pink-soft);
  display:grid;
  place-items:center;
  font-size:28px;
}

.profile-name{
  font-size:20px;
  font-weight:900;
}

.muted{color:var(--muted)}

.stars{
  color:var(--gold);
  margin-top:4px;
}

.star-picker{
  display:flex;
  gap:3px;
  margin:10px 0;
}

.star-btn{
  background:none;
  font-size:31px;
  color:#d8c6cb;
  padding:1px;
}

.star-btn.on{color:var(--gold)}

.status{
  display:inline-block;
  margin-top:6px;
  padding:5px 8px;
  border-radius:999px;
  background:var(--pink-soft);
  color:var(--pink-dark);
  font-size:10px;
  font-weight:800;
}

.filters{
  background:#fff;
  padding:14px;
  border-radius:18px;
  border:1px solid var(--line);
}

.toast{
  display:none;
  position:fixed;
  z-index:500;
  left:15px;
  right:15px;
  bottom:95px;
  background:#39262d;
  color:#fff;
  padding:14px;
  border-radius:15px;
  text-align:center;
  box-shadow:var(--shadow);
}

.toast.show{display:block}

@media(min-width:700px){
  .grid{grid-template-columns:repeat(3,1fr)}
}
</style>
</head>

<body>

<header>
<div class="head">
  <div class="brand">
    <div class="logo">🌸</div>
    <div>
      <div class="brand-title">Baby & Mama Market</div>
      <div class="brand-sub">мамин маркет речей 💕</div>
    </div>
  </div>
  <button class="avatar-top" onclick="openMyProfile()">👩🏻</button>
</div>
</header>

<main>

<div class="hero">
  <h1>Дай речам<br>нову історію 🌸</h1>
  <p>Купуй та продавай дитячі й мамині речі в Україні та Польщі.</p>
</div>

<div class="search-row">
  <input id="search" class="search" placeholder="🔎 Що шукаємо?">
  <button class="filter-btn" onclick="toggleFilters()">⚙️</button>
</div>

<div id="filters" class="filters" style="display:none;margin-top:9px">
  <div class="row">
    <div class="field">
      <label>Країна</label>
      <select id="filterCountry" onchange="renderListings()">
        <option value="">Усі</option>
        <option value="Україна">🇺🇦 Україна</option>
        <option value="Польща">🇵🇱 Польща</option>
      </select>
    </div>

    <div class="field">
      <label>Сортування</label>
      <select id="sort" onchange="renderListings()">
        <option value="new">Нові спочатку</option>
        <option value="cheap">Від дешевих</option>
        <option value="expensive">Від дорогих</option>
      </select>
    </div>
  </div>

  <div class="row">
    <div class="field">
      <label>Ціна від</label>
      <input id="minPrice" type="number" inputmode="numeric">
    </div>
    <div class="field">
      <label>Ціна до</label>
      <input id="maxPrice" type="number" inputmode="numeric">
    </div>
  </div>
</div>

<div class="categories">
  <button class="chip active" onclick="setCategory('Усі',this)">Усі</button>
  <button class="chip" onclick="setCategory('Одяг',this)">👕 Одяг</button>
  <button class="chip" onclick="setCategory('Взуття',this)">👟 Взуття</button>
  <button class="chip" onclick="setCategory('Іграшки',this)">🧸 Іграшки</button>
  <button class="chip" onclick="setCategory('Коляски та автокрісла',this)">🛒 Коляски</button>
  <button class="chip" onclick="setCategory('Годування',this)">🍼 Годування</button>
  <button class="chip" onclick="setCategory('Для мами',this)">🌷 Для мами</button>
  <button class="chip" onclick="setCategory('Інше',this)">✨ Інше</button>
</div>

<div class="section-head">
  <h2 id="pageTitle">Оголошення</h2>
  <div id="count" class="count"></div>
</div>

<div id="products" class="grid">
  <div class="loading">Завантажуємо маркет 🌸</div>
</div>

</main>

<nav class="bottom">
  <button class="nav active" id="navHome" onclick="showHome()">
    <span>🏠</span>Головна
  </button>

  <button class="nav" id="navFav" onclick="showFavorites()">
    <span>♡</span>Обране
  </button>

  <button class="nav" onclick="openSell()">
    <div class="sell-fab">＋</div>
    Продати
  </button>

  <button class="nav" id="navProfile" onclick="openMyProfile()">
    <span>👤</span>Профіль
  </button>
</nav>

<div id="sellModal" class="modal">
<div class="sheet">
<button class="close" onclick="closeSell()">×</button>
<h2 id="formTitle">Нове оголошення 🌸</h2>

<input type="hidden" id="editId">

<div class="field">
<label>Назва *</label>
<input id="title" placeholder="Наприклад: Сукня Zara">
</div>

<div class="field">
<label>Категорія *</label>
<select id="category">
<option>Одяг</option>
<option>Взуття</option>
<option>Іграшки</option>
<option>Коляски та автокрісла</option>
<option>Годування</option>
<option>Аксесуари</option>
<option>Для мами</option>
<option>Інше</option>
</select>
</div>

<div class="row">
<div class="field">
<label>Розмір</label>
<input id="size" placeholder="Наприклад: 74">
</div>

<div class="field">
<label>Стан</label>
<select id="condition">
<option>Нове</option>
<option>Як нове</option>
<option>Дуже хороший</option>
<option>Хороший</option>
<option>Є нюанси</option>
</select>
</div>
</div>

<div class="field">
<label>Країна *</label>
<select id="country" onchange="updateCurrency()">
<option value="">Оберіть країну</option>
<option value="Україна">🇺🇦 Україна</option>
<option value="Польща">🇵🇱 Польща</option>
</select>
</div>

<div class="field">
<label>Місто *</label>
<input id="city" list="cityList" placeholder="Почніть вводити місто">
<datalist id="cityList"></datalist>
</div>

<div class="field">
<label id="priceLabel">Ціна *</label>
<input id="price" type="number" min="0" inputmode="decimal" placeholder="300">
</div>

<div class="field">
<label>Telegram продавця *</label>
<input id="sellerTelegram" placeholder="@username" autocomplete="off" autocapitalize="none">
</div>

<div class="field">
<label>Доставка</label>
<div class="checks">
<label class="check"><input type="checkbox" name="delivery" value="Нова пошта">Нова пошта</label>
<label class="check"><input type="checkbox" name="delivery" value="Укрпошта">Укрпошта</label>
<label class="check"><input type="checkbox" name="delivery" value="Meest">Meest</label>
<label class="check"><input type="checkbox" name="delivery" value="InPost">InPost</label>
<label class="check"><input type="checkbox" name="delivery" value="Paczkomat">Paczkomat</label>
<label class="check"><input type="checkbox" name="delivery" value="Особиста зустріч">Особиста зустріч</label>
</div>
</div>

<div class="field">
<label>Фото, до 6 шт. 📸</label>
<input id="photos" type="file" accept="image/*" multiple onchange="previewPhotos()">
<div id="photoPreview" class="photo-preview"></div>
</div>

<div class="field">
<label>Опис</label>
<textarea id="description" placeholder="Опиши річ, заміри, нюанси..."></textarea>
</div>

<button id="publishBtn" class="primary" onclick="saveListing()">Опублікувати 🌸</button>
<button class="secondary" onclick="closeSell()">Скасувати</button>
</div>
</div>

<div id="detailModal" class="modal">
<div id="detail" class="sheet"></div>
</div>

<div id="profileModal" class="modal">
<div id="profile" class="sheet"></div>
</div>

<div id="toast" class="toast"></div>

function esc(v){
  return String(v??"")
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}

function toast(text){
  const el=document.getElementById("toast");
  el.textContent=text;
  el.classList.add("show");
  clearTimeout(window.toastTimer);
  window.toastTimer=setTimeout(()=>el.classList.remove("show"),2800);
}

function flag(c){
  if(c==="Україна")return "🇺🇦";
  if(c==="Польща")return "🇵🇱";
  return "🌍";
}

function currencySymbol(currency,country){
  return currency==="PLN"||country==="Польща"?"zł":"грн";
}

function formatPrice(p){
  return Number(p||0).toLocaleString("uk-UA");
}

function statusText(s){
  if(s==="sold")return "Продано";
  if(s==="reserved")return "Резерв";
  return "Активне";
}

function tgUser(){
  return tg?.initDataUnsafe?.user||null;
}

function getName(){
  const u=tgUser();
  if(!u)return "Мама";
  return [u.first_name,u.last_name].filter(Boolean).join(" ")||"Мама";
}

async function init(){
  try{
    const {data,error}=await db.auth.getSession();
    if(error)throw error;

    if(data.session){
      me=data.session.user;
    }else{
      const auth=await db.auth.signInAnonymously();
      if(auth.error)throw auth.error;
      me=auth.data.user;
    }

    await ensureProfile();
    await loadAdminStatus();
    await loadFavorites();
    await renderListings();

  }catch(e){
    console.error(e);
    document.getElementById("products").innerHTML=
    `<div class="empty">😔<br><b>Не вдалося відкрити маркет</b><br>${esc(e.message)}</div>`;
  }
}

async function ensureProfile(){
  const u=tgUser();

  const {data:old,error:readError}=await db
  .from("profiles")
  .select("id,username,display_name,avatar_url,country,city,is_admin")
  .eq("id",me.id)
  .maybeSingle();

  if(readError)throw readError;

  const telegram=u?.username
    ?"@"+u.username
    :(old?.username||"");

  if(old){
    const {error}=await db
    .from("profiles")
    .update({
      username:telegram,
      display_name:old.display_name||getName(),
      avatar_url:old.avatar_url||u?.photo_url||null
    })
    .eq("id",me.id);

    if(error)throw error;
  }else{
    const {error}=await db
    .from("profiles")
    .insert({
      id:me.id,
      username:telegram,
      display_name:getName(),
      avatar_url:u?.photo_url||null,
      country:null,
      city:null
    });

    if(error)throw error;
  }
}

async function loadAdminStatus(){
  const {data,error}=await db
  .from("profiles")
  .select("is_admin")
  .eq("id",me.id)
  .maybeSingle();

  if(error){
    console.error(error);
    isAdmin=false;
    return;
  }

  isAdmin=data?.is_admin===true;
}

async function loadFavorites(){
  const {data,error}=await db
  .from("favorites")
  .select("listing_id")
  .eq("user_id",me.id);

  if(error){
    console.error(error);
    return;
  }

  favorites=new Set((data||[]).map(x=>String(x.listing_id)));
}

  renderListings();
}

function toggleFilters(){
  const f=document.getElementById("filters");

}

async function getListings(){
  let q=db
  .from("listings")
  .select("*,profiles(id,username,display_name,avatar_url)")
  .in("status",["active","reserved"]);

  if(currentCategory!=="Усі"){
    q=q.eq("category",currentCategory);
  }

  const sort=document.getElementById("sort").value;

  if(sort==="cheap"){
    q=q.order("price",{ascending:true});
  }else if(sort==="expensive"){
    q=q.order("price",{ascending:false});
  }else{
    q=q.order("created_at",{ascending:false});
  }

  const {data,error}=await q;
  if(error)throw error;

  const search=document.getElementById("search").value.trim().toLowerCase();
  const country=document.getElementById("filterCountry").value;
  const min=Number(document.getElementById("minPrice").value||0);
  const maxRaw=document.getElementById("maxPrice").value;
  const max=maxRaw===""?Infinity:Number(maxRaw);

  return (data||[]).filter(p=>{
    if(favoritesOnly&&!favorites.has(String(p.id)))return false;
    if(country&&p.country!==country)return false;

    const itemPrice=Number(p.price||0);
    if(itemPrice<min||itemPrice>max)return false;

    if(search){
      const text=[
        p.title,p.category,p.size,p.city,p.country,
        p.condition,p.description
      ].join(" ").toLowerCase();

      if(!text.includes(search))return false;
    }

    return true;
  });
}

async function renderListings(){
  const box=document.getElementById("products");
  box.innerHTML='<div class="loading">Завантажуємо 🌸</div>';

  try{
    const items=await getListings();

    document.getElementById("pageTitle").textContent=
      favoritesOnly?"Обране ❤️":"Оголошення";

    document.getElementById("count").textContent=`${items.length} шт.`;

    if(!items.length){
      box.innerHTML=favoritesOnly
      ?'<div class="empty">♡<br><b>В обраному поки порожньо</b></div>'
      :'<div class="empty">🌸<br><b>Нічого не знайдено</b></div>';
      return;
    }

    box.innerHTML=items.map(p=>{
      const seller=p.profiles||{};
      const fav=favorites.has(String(p.id));

      return `
      <article class="card">
        <div class="photo-box" onclick="openDetail('${p.id}')">
          <img class="photo"
          src="${esc(p.photo_url||placeholder)}"
          onerror="this.onerror=null;this.src=placeholder">

          <div class="badge">
            ${flag(p.country)} ${esc(p.country||"")}
          </div>

          <button class="favorite"
          onclick="event.stopPropagation();toggleFavorite('${p.id}')">
            ${fav?"❤️":"🤍"}
          </button>
        </div>

        <div class="card-body" onclick="openDetail('${p.id}')">
          <div class="card-title">${esc(p.title)}</div>

          <div class="price">
            ${formatPrice(p.price)}
            ${currencySymbol(p.currency,p.country)}
          </div>

          <div class="meta">📍 ${esc(p.city||"Не вказано")}</div>

          <div class="meta">
            📏 ${esc(p.size||"Не вказано")} · ${esc(p.condition||"")}
          </div>

          ${p.status==="reserved"
            ?'<div class="status">📌 Резерв</div>'
            :''}

          <div class="seller">
            👩‍🍼 ${esc(seller.display_name||seller.username||"Продавець")}
          </div>
        </div>
      </article>`;
    }).join("");

  }catch(e){
    console.error(e);
    box.innerHTML=
    `<div class="empty">😔<br><b>Помилка завантаження</b><br>${esc(e.message)}</div>`;
  }
}

async function toggleFavorite(id){
  if(!me)return;

  if(favorites.has(String(id))){
    const {error}=await db
    .from("favorites")
    .delete()
    .eq("user_id",me.id)
    .eq("listing_id",id);

    if(error){
      toast(error.message);
      return;
    }

    favorites.delete(String(id));
  }else{
    const {error}=await db
    .from("favorites")
    .insert({
      user_id:me.id,
      listing_id:Number(id)
    });

    if(error){
      toast(error.message);
      return;
    }

    favorites.add(String(id));
  }

  await renderListings();
}

function previewPhotos(){
  const input=document.getElementById("photos");
  const incoming=[...input.files];

  for(const file of incoming){
    if(selectedPhotos.length>=6){
      toast("Можна додати максимум 6 фото 📸");
      break;
    }

    const duplicate=selectedPhotos.some(f=>
      f.name===file.name &&
      f.size===file.size &&
      f.lastModified===file.lastModified
    );

    if(!duplicate)selectedPhotos.push(file);
  }

  input.value="";
  renderPhotoPreview();
}

function renderPhotoPreview(){
  const box=document.getElementById("photoPreview");
  box.innerHTML="";

  selectedPhotos.forEach((file,index)=>{
    const item=document.createElement("div");
    item.className="preview-item";

    const img=document.createElement("img");
    img.src=URL.createObjectURL(file);

    const remove=document.createElement("button");
    remove.type="button";
    remove.className="remove-photo";
    remove.textContent="×";

    remove.onclick=e=>{
      e.preventDefault();
      e.stopPropagation();
      selectedPhotos.splice(index,1);
      renderPhotoPreview();
    };

    item.appendChild(img);
    item.appendChild(remove);
    box.appendChild(item);
  });
}

async function uploadPhoto(file){
  const ext=(file.name.split(".").pop()||"jpg").toLowerCase();

  const uid=crypto.randomUUID
    ?crypto.randomUUID()
    :Date.now()+"-"+Math.random().toString(16).slice(2);

  const path=`${me.id}/${uid}.${ext}`;

  const {error}=await db.storage
  .from("listing-photos")
  .upload(path,file,{
    contentType:file.type||"image/jpeg",
    upsert:false
  });

  if(error)throw error;

  return db.storage
  .from("listing-photos")
  .getPublicUrl(path).data.publicUrl;
}

async function saveListing(){
  const editId=document.getElementById("editId").value;
  const title=document.getElementById("title").value.trim();
  const category=document.getElementById("category").value;
  const size=document.getElementById("size").value.trim();
  const condition=document.getElementById("condition").value;
  const country=document.getElementById("country").value;
  const city=document.getElementById("city").value.trim();
  const price=document.getElementById("price").value;
  const description=document.getElementById("description").value.trim();

  let username=document.getElementById("sellerTelegram").value.trim();

  if(!title){toast("Напиши назву товару ❤️");return}
  if(!country){toast("Оберіть країну 🌍");return}
  if(!city){toast("Вкажи місто 📍");return}
  if(price===""||Number(price)<0){toast("Вкажи правильну ціну 💰");return}
  if(!username){toast("Вкажи Telegram продавця 💬");return}

  username="@"+username.replace(/^@/,"");

  const delivery=[...document.querySelectorAll('input[name="delivery"]:checked')]
  .map(x=>x.value);

  const files=[...selectedPhotos].slice(0,6);

  if(!editId&&!files.length){
    toast("Додай хоча б одне фото 📸");
    return;
  }

  const btn=document.getElementById("publishBtn");
  btn.disabled=true;
  btn.textContent=editId?"Зберігаємо...":"Публікуємо...";

  try{
    const {error:profileError}=await db
    .from("profiles")
    .update({
      username,
      country,
      city
    })
    .eq("id",me.id);

    if(profileError)throw profileError;

    const payload={
      title,
      category,
      size:size||"Не вказано",
      condition,
      country,
      city,
      price:Number(price),
      currency:country==="Польща"?"PLN":"UAH",
      delivery,
      description,
      updated_at:new Date().toISOString()
    };

    let listingId=editId;

    if(editId){
      const {error}=await db
      .from("listings")
      .update(payload)
      .eq("id",editId)
      .eq("seller_id",me.id);

      if(error)throw error;
    }else{
      const {data,error}=await db
      .from("listings")
      .insert({
        ...payload,
        seller_id:me.id,
        status:"active"
      })
      .select()
      .single();

      if(error)throw error;
      listingId=data.id;
    }

    if(files.length){
      const urls=[];

      for(let i=0;i<files.length;i++){
        const url=await uploadPhoto(files[i]);
        urls.push(url);

        const {error:imageError}=await db
        .from("listing_images")
        .insert({
          listing_id:Number(listingId),
          image_url:url,
          position:i
        });

        if(imageError)throw imageError;
      }

      if(urls[0]){
        const {error:coverError}=await db
        .from("listings")
        .update({photo_url:urls[0]})
        .eq("id",listingId)
        .eq("seller_id",me.id);

        if(coverError)throw coverError;
      }
    }

    selectedPhotos=[];
    closeSell();
    await renderListings();

    toast(editId
      ?"Оголошення оновлено 🌸"
      :"Оголошення опубліковано 🌸");

  }catch(e){
    console.error(e);
    toast("Помилка: "+e.message);
  }finally{
    btn.disabled=false;
    btn.textContent=editId?"Зберегти зміни":"Опублікувати 🌸";
  }
}

    .eq("listing_id",id)
    .order("position",{ascending:true});

    const mine=p.seller_id===me.id;

    <div class="detail-title">${esc(p.title)}</div>

      ${currencySymbol(p.currency,p.country)}
    </div>

    ${p.status==="reserved"
      ?'<div class="status">📌 Зарезервовано</div>'
      :''}

    ${isAdmin&&!mine
      ?'<div class="admin-box">👑 Адміністратор може видалити це оголошення</div>'
      :''}

    <div class="detail-row">
      ${flag(p.country)} <b>${esc(p.country||"")}</b>
      · 📍 ${esc(p.city||"")}
    </div>

    <div class="detail-row">
      📏 <b>Розмір:</b> ${esc(p.size||"Не вказано")}
    </div>

    <div class="detail-row">
      ✨ <b>Стан:</b> ${esc(p.condition||"Не вказано")}

      <div class="muted">${esc(seller.username||"")}</div>
      <div style="margin-top:5px">Відкрити профіль ›</div>
    </div>

    ${!mine&&seller.username?`
      <button class="primary"
      onclick="openTelegram('${esc(seller.username)}')">
        💬 Написати продавцю
      </button>
    `:""}

    <button class="secondary"
    onclick="toggleFavorite('${p.id}')">
      ${favorites.has(String(p.id))
        ?"❤️ Прибрати з обраного"
        :"🤍 Додати в обране"}
    </button>

    ${mine?`
      <button class="primary" onclick="editListing('${p.id}')">
        ✏️ Редагувати
      </button>

      ${p.status!=="reserved"?`
        <button class="secondary"

      `:`

    document.getElementById("detailModal").classList.add("show");

}

function openTelegram(username){
  const clean=String(username||"").replace(/^@/,"").trim();

  if(!clean){
    toast("Telegram продавця не вказано");
    return;
  }

  const url="https://t.me/"+clean;

  try{
    if(tg?.openTelegramLink){
      tg.openTelegramLink(url);
    }else{
      window.open(url,"_blank");
    }
  }catch(e){
    window.location.href=url;
  }
}

async function changeStatus(id,status){
  const {error}=await db
  .from("listings")
  .update({
    status,
    updated_at:new Date().toISOString()
  })
  .eq("id",id)
  .eq("seller_id",me.id);

  if(error){
    toast(error.message);
    return;
  }

  closeDetail();
  await renderListings();

  toast(status==="sold"
    ?"Позначено як продано ✅"
    :status==="reserved"
    ?"Товар у резерві 📌"
    :"Резерв знято 🌸");
}

async function deleteListing(id){
  if(!confirm("Точно видалити це оголошення?"))return;

  let query=db
  .from("listings")
  .delete()
  .eq("id",id);

  if(!isAdmin){
    query=query.eq("seller_id",me.id);
  }

  const {error}=await query;

  if(error){
    toast("Помилка: "+error.message);
    return;
  }

  closeDetail();
  await renderListings();
  toast("Оголошення видалено 🗑");
}

async function editListing(id){
  const {data:p,error}=await db
  .from("listings")
  .select("*")
  .eq("id",id)
  .single();

  if(error||p.seller_id!==me.id){
    toast("Редагувати може тільки власник");
    return;
  }

  closeDetail();
  selectedPhotos=[];

  document.getElementById("editId").value=p.id;
  document.getElementById("formTitle").textContent="Редагувати оголошення ✏️";
  document.getElementById("title").value=p.title||"";
  document.getElementById("category").value=p.category||"Одяг";
  document.getElementById("size").value=p.size||"";
  document.getElementById("condition").value=p.condition||"Як нове";
  document.getElementById("country").value=p.country||"";
  document.getElementById("city").value=p.city||"";
  document.getElementById("price").value=p.price||"";
  document.getElementById("description").value=p.description||"";
  document.getElementById("photos").value="";
  document.getElementById("photoPreview").innerHTML="";

  updateCurrency();

  document.querySelectorAll('input[name="delivery"]').forEach(x=>{
    x.checked=(p.delivery||[]).includes(x.value);
  });

  const {data:profile}=await db
  .from("profiles")
  .select("username")
  .eq("id",me.id)
  .maybeSingle();

  document.getElementById("sellerTelegram").value=profile?.username||"";
  document.getElementById("publishBtn").textContent="Зберегти зміни";
  document.getElementById("sellModal").classList.add("show");
}

async function getRating(sellerId){
  const {data,error}=await db
  .from("ratings")
  .select("rating")
  .eq("seller_id",sellerId);

  if(error||!data?.length)return {avg:0,count:0};

  const values=data.map(x=>Number(x.rating));

  return {
    avg:values.reduce((a,b)=>a+b,0)/values.length,
    count:values.length
  };
}

function stars(avg){
  if(!avg)return "☆☆☆☆☆";
  const n=Math.round(avg);
  return "★".repeat(n)+"☆".repeat(5-n);
}

async function openProfile(id){
  try{
    if(!id){
      toast("Не вдалося визначити профіль");
      return;
    }

    const {data:seller,error}=await db
    .from("profiles")
    .select("id,username,display_name,avatar_url,country,city,is_admin")
    .eq("id",id)
    .maybeSingle();

    if(error)throw error;
    if(!seller)throw new Error("Профіль не знайдено");

    const mine=id===me.id;

    let query=db
    .from("listings")
    .select("*")
    .eq("seller_id",id)
    .order("created_at",{ascending:false});

    if(!mine){
      query=query.in("status",["active","reserved"]);
    }

    const listingResult=await query;

    if(listingResult.error)throw listingResult.error;

    const listings=listingResult.data||[];
    const rating=await getRating(id);

    let myRating=null;

    if(!mine){
      const {data:r}=await db
      .from("ratings")
      .select("rating,review")
      .eq("seller_id",id)
      .eq("reviewer_id",me.id)
      .maybeSingle();

      myRating=r?.rating||null;
    }

    ratingChoice=myRating||5;

    document.getElementById("profile").innerHTML=`
    <button class="close" onclick="closeProfile()">×</button>

    <div class="profile-head">
      ${seller.avatar_url
        ?`<img class="profile-avatar"
          src="${esc(seller.avatar_url)}"
          onerror="this.outerHTML='<div class=&quot;profile-avatar&quot;>👩🏻</div>'">`
        :'<div class="profile-avatar">👩🏻</div>'}

      <div>
        <div class="profile-name">
          ${esc(seller.display_name||"Мама")}
          ${seller.is_admin?" 👑":""}
        </div>

        <div class="muted">
          ${esc(seller.username||"")}
        </div>

        <div class="stars">
          ${stars(rating.avg)}
          ${rating.count
            ?`${rating.avg.toFixed(1)} · ${rating.count}`
            :"Без оцінок"}
        </div>
      </div>
    </div>

    ${seller.country||seller.city?`
      <div class="seller-box">
        ${flag(seller.country)}
        ${esc(seller.country||"")}
        ${seller.city?" · 📍 "+esc(seller.city):""}
      </div>
    `:""}

    ${!mine?`
      <div class="seller-box">
        <b>Оцінити продавця</b>

        <div id="starPicker" class="star-picker">
          ${[1,2,3,4,5].map(n=>`
            <button
            class="star-btn ${n<=ratingChoice?"on":""}"
            onclick="chooseRating(${n})">★</button>
          `).join("")}
        </div>

        <button class="secondary" onclick="saveRating('${id}')">
          ⭐ Зберегти оцінку
        </button>
      </div>
    `:""}

    ${!mine&&seller.username?`
      <button class="primary"
      onclick="openTelegram('${esc(seller.username)}')">
        💬 Написати в Telegram
      </button>
    `:""}

    <h3>${mine?"Мої оголошення":"Оголошення продавця"}</h3>

    <div class="grid">
      ${listings.map(p=>`
        <article class="card"
        onclick="closeProfile();openDetail('${p.id}')">

          <div class="photo-box">
            <img class="photo"
            src="${esc(p.photo_url||placeholder)}"
            onerror="this.onerror=null;this.src=placeholder">
          </div>

          <div class="card-body">
            <div class="card-title">${esc(p.title)}</div>

            <div class="price">
              ${formatPrice(p.price)}
              ${currencySymbol(p.currency,p.country)}
            </div>

            <div class="meta">📍 ${esc(p.city||"")}</div>

            ${mine?`
              <div class="status">${statusText(p.status)}</div>
            `:""}
          </div>
        </article>
      `).join("")||'<div class="empty">Поки немає оголошень 🌸</div>'}
    </div>
    `;

    document.getElementById("profileModal").classList.add("show");

  }catch(e){
    console.error("Profile error:",e);
    toast("Не вдалося відкрити профіль: "+e.message);
  }
}

function closeProfile(){
  document.getElementById("profileModal").classList.remove("show");
}

async function openMyProfile(){
  if(!me){
    toast("Профіль ще завантажується 🌸");
    return;
  }

  setNav("navProfile");
  await openProfile(me.id);
}

function chooseRating(n){
  ratingChoice=n;

  document.querySelectorAll("#starPicker .star-btn")
  .forEach((x,i)=>{
    x.classList.toggle("on",i<n);
  });
}

async function saveRating(sellerId){
  if(sellerId===me.id)return;

  const {error}=await db
  .from("ratings")
  .upsert({
    seller_id:sellerId,
    reviewer_id:me.id,
    rating:ratingChoice
  },{
    onConflict:"seller_id,reviewer_id"
  });

  if(error){
    toast(error.message);
    return;
  }

  toast("Оцінку збережено ⭐");
  await openProfile(sellerId);
}

["sellModal","detailModal","profileModal"].forEach(id=>{
  const modal=document.getElementById(id);

  modal.addEventListener("click",e=>{
    if(e.target===modal){
      modal.classList.remove("show");
    }
  });
});

init();
</script>
