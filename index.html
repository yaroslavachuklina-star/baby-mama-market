<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Baby & Mama Market 🌸</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  background:#fff7f3;
  color:#38252a;
}
header{
  padding:22px 18px 14px;
  background:#fff;
  position:sticky;
  top:0;
  z-index:10;
  border-bottom:1px solid #f1dedb;
}
.logo{
  font-size:25px;
  font-weight:800;
}
.subtitle{
  color:#9b777d;
  font-size:14px;
  margin-top:4px;
}
.search{
  margin-top:15px;
  width:100%;
  padding:14px 16px;
  border:0;
  border-radius:16px;
  background:#f7eeee;
  font-size:16px;
  outline:none;
}
.container{
  padding:16px;
  max-width:700px;
  margin:auto;
}
.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding-bottom:10px;
}
.categories button{
  white-space:nowrap;
  border:0;
  background:#fff;
  padding:10px 14px;
  border-radius:20px;
  color:#704c55;
}
.categories button.active{
  background:#713b4b;
  color:white;
}
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:12px;
}
.card{
  background:white;
  border-radius:20px;
  overflow:hidden;
  box-shadow:0 3px 15px rgba(90,50,60,.08);
}
.photo{
  width:100%;
  height:170px;
  object-fit:cover;
  background:#f3e4df;
}
.card-body{padding:12px}
.card-title{
  font-weight:700;
  font-size:15px;
  line-height:1.25;
}
.price{
  margin-top:8px;
  font-size:18px;
  font-weight:800;
  color:#713b4b;
}
.meta{
  color:#9b777d;
  font-size:12px;
  margin-top:5px;
}
button{
  font-family:inherit;
  cursor:pointer;
}
.sell{
  width:100%;
  margin:16px 0;
  padding:16px;
  border:0;
  border-radius:18px;
  background:#713b4b;
  color:white;
  font-size:17px;
  font-weight:700;
}
.bottom{
  position:fixed;
  bottom:0;
  left:0;
  right:0;
  background:white;
  border-top:1px solid #ead9d8;
  display:flex;
  justify-content:space-around;
  padding:9px 5px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
}
.nav{
  border:0;
  background:none;
  color:#9b777d;
  font-size:12px;
}
.nav.active{color:#713b4b;font-weight:700}
.nav span{
  display:block;
  font-size:23px;
}
.page{
  padding-bottom:90px;
}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:rgba(40,20,25,.45);
  z-index:50;
  align-items:flex-end;
}
.modal.show{display:flex}
.sheet{
  width:100%;
  max-height:92vh;
  overflow:auto;
  background:#fffaf8;
  border-radius:25px 25px 0 0;
  padding:22px;
}
.sheet h2{margin-top:0}
.field{
  margin-bottom:14px;
}
.field label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-bottom:6px;
}
.field input,.field textarea,.field select{
  width:100%;
  border:1px solid #ead9d8;
  background:white;
  border-radius:14px;
  padding:13px;
  font-size:16px;
  outline:none;
}
.field textarea{min-height:90px;resize:vertical}
.form-buttons{
  display:flex;
  gap:10px;
  margin-top:18px;
}
.cancel{
  flex:1;
  border:0;
  border-radius:15px;
  padding:14px;
  background:#eee2e0;
}
.submit{
  flex:2;
  border:0;
  border-radius:15px;
  padding:14px;
  background:#713b4b;
  color:white;
  font-weight:700;
}
.empty{
  text-align:center;
  padding:45px 20px;
  color:#9b777d;
}
.detail-photo{
  width:100%;
  max-height:360px;
  object-fit:cover;
  border-radius:20px;
}
.close{
  float:right;
  border:0;
  background:#eee2e0;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:20px;
}
</style>
</head>

<body>

<div class="page">

<header>
  <div class="logo">🌸 Baby & Mama Market</div>
  <div class="subtitle">Речі для малюків від мам 💕</div>
  <input id="search" class="search" placeholder="🔎 Куртки, боді, черевики...">
</header>

<div class="container">

  <button class="sell" onclick="openSell()">➕ Додати оголошення</button>

  <div class="categories">
    <button class="active" onclick="filterCategory('Усі',this)">Усі</button>
    <button onclick="filterCategory('Одяг',this)">👗 Одяг</button>
    <button onclick="filterCategory('Взуття',this)">👟 Взуття</button>
    <button onclick="filterCategory('Іграшки',this)">🧸 Іграшки</button>
    <button onclick="filterCategory('Аксесуари',this)">🎀 Аксесуари</button>
  </div>

  <div id="products" class="grid"></div>

</div>
</div>

<div class="bottom">
  <button class="nav active" onclick="showHome()">
    <span>🏠</span>Головна
  </button>
  <button class="nav" onclick="openSell()">
    <span>➕</span>Продати
  </button>
  <button class="nav" onclick="showMyListings()">
    <span>❤️</span>Мої оголошення
  </button>
</div>

<div id="sellModal" class="modal">
  <div class="sheet">
    <button class="close" onclick="closeSell()">×</button>
    <h2>Додати оголошення 🌸</h2>

    <div class="field">
      <label>Назва</label>
      <input id="title" placeholder="Наприклад: Боді для дівчинки">
    </div>

    <div class="field">
      <label>Категорія</label>
      <select id="category">
        <option>Одяг</option>
        <option>Взуття</option>
        <option>Іграшки</option>
        <option>Аксесуари</option>
        <option>Інше</option>
      </select>
    </div>

    <div class="field">
      <label>Розмір</label>
      <input id="size" placeholder="Наприклад: 74">
    </div>

    <div class="field">
      <label>Стан</label>
      <select id="condition">
        <option>Нове</option>
        <option>Як нове</option>
        <option>Дуже хороший стан</option>
        <option>Є нюанси</option>
      </select>
    </div>

    <div class="field">
      <label>Ціна, грн</label>
      <input id="price" type="number" placeholder="300">
    </div>

    <div class="field">
      <label>Місто</label>
      <input id="city" placeholder="Київ">
    </div>

    <div class="field">
      <label>Telegram продавця</label>
      <input id="telegram" placeholder="@username">
    </div>

    <div class="field">
      <label>Фото</label>
      <input id="photo" type="url" placeholder="Посилання на фото">
    </div>

    <div class="field">
      <label>Опис</label>
      <textarea id="description" placeholder="Опиши річ..."></textarea>
    </div>

    <div class="form-buttons">
      <button class="cancel" onclick="closeSell()">Скасувати</button>
      <button class="submit" onclick="addListing()">Опублікувати</button>
    </div>
  </div>
</div>

<div id="detailModal" class="modal">
  <div class="sheet">
    <button class="close" onclick="closeDetail()">×</button>
    <div id="detail"></div>
  </div>
</div>

<script>

const tg = window.Telegram?.WebApp;
if(tg){
  tg.ready();
  tg.expand();
}

let categoryFilter = "Усі";

const sampleProducts = [
 {
  id:1,
  title:"Теплий флісовий костюм",
  category:"Одяг",
  size:"80",
  condition:"Як нове",
  price:450,
  city:"Київ",
  telegram:"@seller1",
  photo:"https://images.unsplash.com/photo-1519238263530-99bdd11df2ea?w=700"
 },
 {
  id:2,
  title:"Дитячі кросівки",
  category:"Взуття",
  size:"24",
  condition:"Дуже хороший стан",
  price:600,
  city:"Київ",
  telegram:"@seller2",
  photo:"https://images.unsplash.com/photo-1551107696-a4b0c5a0d9a2?w=700"
 },
 {
  id:3,
  title:"Сукня для дівчинки",
  category:"Одяг",
  size:"86",
  condition:"Нове",
  price:500,
  city:"Львів",
  telegram:"@seller3",
  photo:"https://images.unsplash.com/photo-1518831959646-742c3a14ebf7?w=700"
 },
 {
  id:4,
  title:"М'яка іграшка",
  category:"Іграшки",
  size:"Універсальний",
  condition:"Як нове",
  price:250,
  city:"Київ",
  telegram:"@seller4",
  photo:"https://images.unsplash.com/photo-1559454403-b8fb88521f11?w=700"
 }
];

let userListings =
  JSON.parse(localStorage.getItem("babyMamaListings") || "[]");

function allProducts(){
  return [...userListings,...sampleProducts];
}

function render(){
  const search =
    document.getElementById("search").value.toLowerCase();

  let products = allProducts().filter(p=>{
    const matchesCategory =
      categoryFilter==="Усі" || p.category===categoryFilter;

    const text =
      `${p.title} ${p.category} ${p.size} ${p.city}`.toLowerCase();

    return matchesCategory && text.includes(search);
  });

  const box=document.getElementById("products");

  if(!products.length){
    box.innerHTML=`<div class="empty">😔<br>Нічого не знайдено</div>`;
    return;
  }

  box.innerHTML=products.map(p=>`
    <div class="card" onclick="openDetail(${p.id})">
      <img class="photo"
           src="${p.photo || 'https://placehold.co/700x500/f3e4df/713b4b?text=Baby+%26+Mama'}"
           onerror="this.src='https://placehold.co/700x500/f3e4df/713b4b?text=Baby+%26+Mama'">
      <div class="card-body">
        <div class="card-title">${escapeHTML(p.title)}</div>
        <div class="price">${Number(p.price).toLocaleString('uk-UA')} грн</div>
        <div class="meta">📏 ${escapeHTML(p.size)} · 📍 ${escapeHTML(p.city)}</div>
        <div class="meta">${escapeHTML(p.condition)}</div>
      </div>
    </div>
  `).join("");
}

function escapeHTML(value){
  return String(value || "")
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

function filterCategory(category,button){
  categoryFilter=category;
  document.querySelectorAll(".categories button")
    .forEach(b=>b.classList.remove("active"));
  button.classList.add("active");
  render();
}

document.getElementById("search")
  .addEventListener("input",render);

function openSell(){
  document.getElementById("sellModal").classList.add("show");
}

function closeSell(){
  document.getElementById("sellModal").classList.remove("show");
}

function addListing(){

  const title=document.getElementById("title").value.trim();
  const price=document.getElementById("price").value.trim();

  if(!title || !price){
    alert("Заповни назву та ціну ❤️");
    return;
  }

  const listing={
    id:Date.now(),
    title,
    category:document.getElementById("category").value,
    size:document.getElementById("size").value || "Не вказано",
    condition:document.getElementById("condition").value,
    price:Number(price),
    city:document.getElementById("city").value || "Не вказано",
    telegram:document.getElementById("telegram").value || "",
    photo:document.getElementById("photo").value || "",
    description:document.getElementById("description").value || ""
  };

  userListings.unshift(listing);
  localStorage.setItem(
    "babyMamaListings",
    JSON.stringify(userListings)
  );

  closeSell();
  render();

  alert("Оголошення додано 🌸");
}

function openDetail(id){

  const p=allProducts().find(x=>x.id===id);
  if(!p)return;

  let telegram=p.telegram || "";
  telegram=telegram.replace("@","");

  document.getElementById("detail").innerHTML=`
    <img class="detail-photo"
      src="${p.photo || 'https://placehold.co/700x500/f3e4df/713b4b?text=Baby+%26+Mama'}"
      onerror="this.src='https://placehold.co/700x500/f3e4df/713b4b?text=Baby+%26+Mama'">

    <h2>${escapeHTML(p.title)}</h2>

    <div class="price">
      ${Number(p.price).toLocaleString('uk-UA')} грн
    </div>

    <p>📏 <b>Розмір:</b> ${escapeHTML(p.size)}</p>
    <p>✨ <b>Стан:</b> ${escapeHTML(p.condition)}</p>
    <p>📍 <b>Місто:</b> ${escapeHTML(p.city)}</p>

    <p>${escapeHTML(p.description || "Опис не додано.")}</p>

    ${
      telegram
      ? `<button class="sell"
          onclick="openTelegram('${telegram}')">
          💬 Написати продавцю
         </button>`
      : `<p class="meta">Telegram продавця не вказано.</p>`
    }
  `;

  document.getElementById("detailModal").classList.add("show");
}

function openTelegram(username){
  const url="https://t.me/"+username;

  if(tg){
    tg.openTelegramLink(url);
  }else{
    window.open(url,"_blank");
  }
}

function closeDetail(){
  document.getElementById("detailModal").classList.remove("show");
}

function showHome(){
  window.scrollTo({top:0,behavior:"smooth"});
}

function showMyListings(){
  if(!userListings.length){
    alert("У тебе ще немає оголошень 🌸");
    return;
  }

  categoryFilter="Усі";

  document.getElementById("search").value="";

  document.getElementById("products").innerHTML=
    userListings.map(p=>`
      <div class="card" onclick="openDetail(${p.id})">
        <img class="photo"
          src="${p.photo || 'https://placehold.co/700x500/f3e4df/713b4b?text=Baby+%26+Mama'}">
        <div class="card-body">
          <div class="card-title">${escapeHTML(p.title)}</div>
          <div class="price">${Number(p.price).toLocaleString('uk-UA')} грн</div>
          <div class="meta">📏 ${escapeHTML(p.size)} · 📍 ${escapeHTML(p.city)}</div>
        </div>
      </div>
    `).join("");
}

render();

</script>

</body>
</html>
