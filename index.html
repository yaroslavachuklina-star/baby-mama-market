<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Baby & Mama Market 🌸</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
:root{
  --bg:#fbf1ee;
  --card:#fffaf8;
  --white:#fff;
  --pink:#b85f7d;
  --pink2:#8d425e;
  --soft:#f3e2e4;
  --text:#3b2830;
  --muted:#9a8189;
  --line:#ead9de;
  --green:#608b72;
  --red:#b94e5e;
  --gold:#bd8d3e;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

html{scroll-behavior:smooth}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  padding-bottom:100px;
}

button,input,select,textarea{font:inherit}
button{border:0;cursor:pointer}

header{
  background:#fff;
  padding:calc(20px + env(safe-area-inset-top)) 18px 20px;
  border-bottom:1px solid var(--line);
}

.brand{display:flex;align-items:center;gap:11px}
.logo{font-size:38px}

h1{margin:0;font-size:25px}
.subtitle{color:var(--muted);margin-top:5px}

main{padding:15px}

.search{
  width:100%;
  padding:16px;
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  outline:none;
  font-size:16px;
}

.add{
  width:100%;
  padding:16px;
  margin-top:11px;
  border-radius:18px;
  background:var(--pink2);
  color:#fff;
  font-size:16px;
  font-weight:800;
}

.quickFilters{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:9px;
  margin-top:11px;
}

.quickFilters select{
  width:100%;
  padding:12px 9px;
  border-radius:14px;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
}

.categories{
  display:flex;
  gap:8px;
  overflow-x:auto;
  padding:13px 0;
  scrollbar-width:none;
}
.categories::-webkit-scrollbar{display:none}

.categories button{
  flex:none;
  padding:10px 15px;
  border-radius:999px;
  background:#fff;
  border:1px solid var(--line);
  color:#557eb0;
}

.categories button.active{
  background:var(--pink);
  color:#fff;
  border-color:var(--pink);
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:12px;
}

.card{
  overflow:hidden;
  border-radius:20px;
  background:var(--card);
  border:1px solid var(--line);
  box-shadow:0 5px 18px rgba(80,40,55,.06);
}

.photoWrap{
  position:relative;
}

.cardPhoto{
  display:block;
  width:100%;
  aspect-ratio:1/1;
  object-fit:cover;
  background:#eee1df;
}

.countryBadge{
  position:absolute;
  left:8px;
  top:8px;
  padding:6px 9px;
  border-radius:999px;
  background:rgba(255,255,255,.9);
  font-size:11px;
  font-weight:800;
}

.cardBody{padding:11px}

.title{
  font-size:15px;
  font-weight:900;
  line-height:1.25;
  min-height:37px;
}

.price{
  color:var(--pink2);
  font-size:19px;
  font-weight:900;
  margin-top:5px;
}

.meta{
  font-size:12px;
  color:var(--muted);
  margin-top:5px;
  line-height:1.4;
}

.sellerMini{
  margin-top:9px;
  padding-top:9px;
  border-top:1px solid var(--line);
  font-size:12px;
  font-weight:700;
}

.empty{
  grid-column:1/-1;
  text-align:center;
  padding:55px 15px;
  color:var(--muted);
  line-height:1.6;
}

.bottom{
  position:fixed;
  z-index:30;
  left:0;right:0;bottom:0;
  background:#fff;
  border-top:1px solid var(--line);
  display:grid;
  grid-template-columns:repeat(3,1fr);
  min-height:78px;
  padding-bottom:env(safe-area-inset-bottom);
}

.bottom button{
  background:none;
  color:var(--muted);
  font-size:12px;
}
.bottom span{display:block;font-size:23px;margin-bottom:3px}

.modal{
  display:none;
  position:fixed;
  z-index:100;
  inset:0;
  background:rgba(38,22,28,.47);
  align-items:flex-end;
}

.modal.show{display:flex}

.sheet{
  width:100%;
  max-height:94vh;
  overflow:auto;
  background:#fffaf8;
  border-radius:27px 27px 0 0;
  padding:20px 16px calc(30px + env(safe-area-inset-bottom));
  position:relative;
}

.close{
  position:absolute;
  right:14px;
  top:12px;
  width:40px;
  height:40px;
  border-radius:50%;
  background:#f0e1df;
  font-size:25px;
  color:var(--text);
}

.sheet h2{margin:4px 50px 20px 0}

.field{margin:13px 0}

.field label{
  display:block;
  font-weight:800;
  margin-bottom:7px;
  font-size:14px;
}

.field input,
.field select,
.field textarea{
  width:100%;
  padding:14px;
  border:1px solid var(--line);
  border-radius:15px;
  background:#fff;
  color:var(--text);
  outline:none;
}

.field textarea{
  min-height:105px;
  resize:vertical;
}

.row{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.file{
  border:1px dashed #cca4b1 !important;
}

.preview img{
  width:100%;
  max-height:300px;
  object-fit:cover;
  border-radius:17px;
  margin-top:10px;
}

.actions{
  display:grid;
  grid-template-columns:1fr 1.5fr;
  gap:10px;
  margin-top:18px;
}

.secondary,.primary,.danger{
  padding:14px;
  border-radius:15px;
  font-weight:800;
}

.secondary{background:#efe1df;color:var(--text)}
.primary{background:var(--pink2);color:#fff}
.danger{background:#fde4e7;color:var(--red)}

.full{width:100%;margin-top:10px}

.detailPhoto{
  width:100%;
  max-height:440px;
  object-fit:cover;
  border-radius:20px;
}

.detailTitle{
  font-size:24px;
  font-weight:900;
  margin-top:14px;
}

.detailLine{
  padding:10px 0;
  border-bottom:1px solid var(--line);
  line-height:1.45;
}

.sellerBox{
  background:#fff;
  border:1px solid var(--line);
  border-radius:18px;
  padding:14px;
  margin-top:14px;
}

.profileHead{
  display:flex;
  gap:12px;
  align-items:center;
  margin-bottom:18px;
}

.avatar{
  width:64px;
  height:64px;
  border-radius:50%;
  background:var(--soft);
  display:grid;
  place-items:center;
  font-size:28px;
  object-fit:cover;
}

.profileName{font-size:20px;font-weight:900}
.username{color:var(--muted);margin-top:3px}
.rating{color:var(--gold);margin-top:4px;font-size:13px}

.status{
  display:inline-block;
  padding:5px 9px;
  margin-top:6px;
  border-radius:999px;
  background:#eee0e5;
  color:var(--pink2);
  font-size:11px;
  font-weight:800;
}

.toast{
  display:none;
  position:fixed;
  z-index:500;
  left:16px;right:16px;
  bottom:100px;
  background:#3c252e;
  color:#fff;
  padding:14px;
  border-radius:15px;
  text-align:center;
}
.toast.show{display:block}

.starBox{display:flex;gap:3px;margin:10px 0}
.star{
  background:none;
  padding:2px;
  font-size:30px;
  color:#d9c7cd;
}
.star.on{color:#d1a03f}

@media(min-width:700px){
  main{max-width:800px;margin:auto}
  header>div{max-width:800px;margin:auto}
  .sheet{max-width:700px;margin:auto}
}
</style>
</head>

<body>

<header>
<div class="brand">
  <div class="logo">🌸</div>
  <div>
    <h1>Baby & Mama Market</h1>
    <div class="subtitle">Речі для малюків від мам 💕</div>
  </div>
</div>
</header>

<main>

<input id="search" class="search"
placeholder="🔎 Пошук речі, розміру або міста">

<button class="add" onclick="openSell()">＋ Додати оголошення</button>

<div class="quickFilters">
<select id="countryFilter" onchange="render()">
<option value="">🌍 Усі країни</option>
<option value="Україна">🇺🇦 Україна</option>
<option value="Польща">🇵🇱 Польща</option>
</select>

<select id="sort" onchange="render()">
<option value="new">Нові спочатку</option>
<option value="cheap">Ціна ↑</option>
<option value="expensive">Ціна ↓</option>
</select>
</div>

<div class="categories">
<button class="active" onclick="category('Усі',this)">Усі</button>
<button onclick="category('Одяг',this)">Одяг</button>
<button onclick="category('Взуття',this)">Взуття</button>
<button onclick="category('Іграшки',this)">Іграшки</button>
<button onclick="category('Аксесуари',this)">Аксесуари</button>
<button onclick="category('Для мами',this)">Для мами</button>
<button onclick="category('Інше',this)">Інше</button>
</div>

<div id="products" class="grid">
<div class="empty">Підключення 🌸</div>
</div>

</main>

<nav class="bottom">
<button onclick="home()"><span>🏠</span>Головна</button>
<button onclick="openSell()"><span>➕</span>Продати</button>
<button onclick="myProfile()"><span>👤</span>Мій профіль</button>
</nav>

<!-- SELL -->

<div id="sellModal" class="modal">
<div class="sheet">

<button class="close" onclick="closeSell()">×</button>
<h2>Нове оголошення 🌸</h2>

<div class="field">
<label>Назва *</label>
<input id="title" placeholder="Наприклад: Сукня Zara">
</div>

<div class="row">
<div class="field">
<label>Категорія</label>
<select id="formCategory">
<option>Одяг</option>
<option>Взуття</option>
<option>Іграшки</option>
<option>Аксесуари</option>
<option>Для мами</option>
<option>Інше</option>
</select>
</div>

<div class="field">
<label>Розмір</label>
<input id="size" placeholder="74">
</div>
</div>

<div class="field">
<label>Стан</label>
<select id="condition">
<option>Нове</option>
<option>Як нове</option>
<option>Дуже хороший стан</option>
<option>Хороший стан</option>
<option>Є нюанси</option>
</select>
</div>

<div class="field">
<label>Ціна *</label>
<input id="price" type="number" min="0" inputmode="decimal" placeholder="300">
</div>

<div class="field">
<label>Країна *</label>
<select id="country" onchange="countryChanged()">
<option value="">Оберіть країну</option>
<option value="Україна">🇺🇦 Україна</option>
<option value="Польща">🇵🇱 Польща</option>
</select>
</div>

<div class="field">
<label>Місто *</label>
<select id="citySelect" onchange="cityChanged()" disabled>
<option value="">Спочатку оберіть країну</option>
</select>
</div>

<div id="customCityBox" class="field" style="display:none">
<label>Вкажіть своє місто</label>
<input id="customCity" placeholder="Назва міста">
</div>

<div class="field">
<label>Telegram продавця *</label>
<input id="telegram" placeholder="@username"
autocomplete="off" autocapitalize="none">
</div>

<div class="field">
<label>📸 Фото з галереї</label>
<input id="photo" class="file" type="file"
accept="image/jpeg,image/png,image/webp,image/heic,image/heif"
onchange="preview(event)">
<div id="preview" class="preview"></div>
</div>

<div class="field">
<label>Опис</label>
<textarea id="description"
placeholder="Стан речі, заміри, нюанси, доставка..."></textarea>
</div>

<div class="actions">
<button class="secondary" onclick="closeSell()">Скасувати</button>
<button id="publish" class="primary" onclick="publish()">Опублікувати</button>
</div>

</div>
</div>

<!-- DETAILS -->

<div id="detailModal" class="modal">
<div id="detail" class="sheet"></div>
</div>

<!-- PROFILE -->

<div id="profileModal" class="modal">
<div id="profile" class="sheet"></div>
</div>

<div id="toast" class="toast"></div>
